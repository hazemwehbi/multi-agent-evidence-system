[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "maeds"
version = "0.1.0"
description = "Multi-Agent Evidence and Decision System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2", "openai>=2,<3"]

[project.scripts]
maeds = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
